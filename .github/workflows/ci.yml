name: ci

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Verify runnable architecture (Node ${{ matrix.node-version }})
    runs-on: ubuntu-latest
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        node-version: ["22.19.0", "24"]

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "${{ matrix.node-version }}"

      - name: Enable Corepack
        run: corepack enable

      - name: Check runtime floors
        run: |
          node scripts/pnpm-release-age-policy.mjs
          pnpm run check:node

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Check dependency vulnerabilities
        if: ${{ matrix.node-version == '22.19.0' }}
        run: pnpm run check:v1-dependency-vulnerabilities

      - name: Scan secrets
        if: ${{ matrix.node-version == '22.19.0' }}
        run: |
          docker run --rm \
            -v "$PWD:/repo" \
            ghcr.io/gitleaks/gitleaks:v8.30.1 \
            dir --redact --no-banner --config /repo/.gitleaks.toml /repo

      - name: Check OSS and package boundaries
        run: |
          pnpm run check:oss-hygiene
          node scripts/check-license-consistency.mjs
          pnpm run check:architecture

      - name: Build and typecheck runnable closure
        run: |
          pnpm -r --sort \
            --filter @mono-agent/module-sdk \
            --filter @mono-agent/core \
            --filter @mono-agent/cli \
            --filter @mono-agent/runtime-pi \
            --filter @mono-agent/channel-webhook \
            --filter create-mono-agent run build
          pnpm -r --sort \
            --filter @mono-agent/module-sdk \
            --filter @mono-agent/core \
            --filter @mono-agent/cli \
            --filter @mono-agent/runtime-pi \
            --filter @mono-agent/channel-webhook \
            --filter create-mono-agent run typecheck

      - name: Test runnable closure
        run: |
          pnpm -r --sort \
            --filter @mono-agent/module-sdk \
            --filter @mono-agent/core \
            --filter @mono-agent/cli \
            --filter @mono-agent/runtime-pi \
            --filter @mono-agent/channel-webhook \
            --filter create-mono-agent run test

      - name: Prove packed clean-project turn
        if: ${{ matrix.node-version == '22.19.0' }}
        run: pnpm run verify:v1-minimal

      - name: Check generated contracts and whitespace
        run: git diff --exit-code && git diff --check

  verdict:
    name: Required verdict
    if: always()
    needs:
      - verify
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Publish required verdict
        env:
          VERIFY_RESULT: ${{ needs.verify.result }}
        run: |
          if [[ "$VERIFY_RESULT" != "success" ]]; then
            echo "CI VERDICT: FAILED"
            exit 1
          fi
          echo "CI VERDICT: GREEN"
