name: ci

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Verify (Node ${{ matrix.node-version }})
    # scripts/__tests__/verify-all.test.mjs enforces the complete ordered action,
    # environment, and exact run-script projection; VERIFY_GATE_DELTA declares exceptions.
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        node-version: ["22.19.0", "24"]

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "${{ matrix.node-version }}"

      - name: Enable Corepack
        run: corepack enable

      - name: Check pnpm release-age policy
        run: node scripts/pnpm-release-age-policy.mjs

      - name: Check Node support floor
        run: pnpm run check:node

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Check production dependency vulnerabilities
        if: ${{ matrix.node-version == '22.19.0' }}
        run: pnpm run check:dependency-vulnerabilities

      - name: Check secrets
        run: |
          docker run --rm \
            -v "$PWD:/repo" \
            ghcr.io/gitleaks/gitleaks:v8.30.1 \
            dir --redact --no-banner --config /repo/.gitleaks.toml /repo

      - name: Check OSS hygiene
        run: pnpm run check:oss-hygiene

      - name: Check license consistency
        run: pnpm run check:licenses

      - name: Check Codex discoverability
        run: pnpm run check:codex-discoverability

      - name: Check consumer docs consistency
        run: pnpm run check:consumer-docs-consistency

      - name: Derive release smoke tag
        id: release-smoke
        run: |
          set -euo pipefail
          VERSION="$(node -e "process.stdout.write(require('./packages/agent-app/package.json').version)")"
          echo "tag=v${VERSION}" >> "$GITHUB_OUTPUT"

      - name: Check getting-started version pins
        run: pnpm run check:getting-started-version-pins

      - name: Check documentation quality
        run: pnpm run check:docs

      - name: Validate release package graph
        run: pnpm run release:validate -- --tag "${{ steps.release-smoke.outputs.tag }}"

      - name: Check package architecture
        run: pnpm run check:architecture

      - name: Build packages and demos
        run: pnpm run build

      - name: Typecheck marked documentation snippets
        run: pnpm run check:doc-snippets

      - name: Check agent-runtime deep imports
        run: pnpm run check:deep-imports

      - name: Verify consumer contracts
        run: pnpm run verify:consumers --skip-build

      - name: Validate package tarballs
        run: pnpm run release:pack -- --tag "${{ steps.release-smoke.outputs.tag }}"

      - name: Install packed consumer at the minimum Node version
        if: ${{ matrix.node-version == '22.19.0' }}
        run: pnpm run release:consumer -- --tag "${{ steps.release-smoke.outputs.tag }}" --require-minimum

      - name: Typecheck packages and demos
        run: pnpm run typecheck

      - name: Run tests
        run: pnpm test

      - name: Check whitespace
        run: git diff --check

  website:
    name: Website
    runs-on: ubuntu-latest
    timeout-minutes: 20

    # website/ is an isolated pnpm workspace (own lockfile) that renders ../docs.
    # Gate its build and rendered accessibility independently from the package
    # verification lane. Runs in parallel with `verify` so its browser setup
    # does not lengthen the package matrix.
    defaults:
      run:
        working-directory: website

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "24"

      - name: Enable Corepack
        run: corepack enable

      - name: Install website dependencies
        run: pnpm install --frozen-lockfile

      - name: Test website transforms
        run: pnpm run test:unit

      - name: Install Chromium
        run: pnpm exec playwright install --with-deps chromium

      - name: Build docs site (check-asides -> sync-content -> astro build -> check-links)
        run: pnpm run build

      - name: Audit every built page for accessibility
        run: pnpm run test:a11y

  release-dry-run:
    name: Release dry run
    if: github.event_name == 'pull_request'
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "24"

      - name: Enable Corepack
        run: corepack enable

      - name: Check pnpm release-age policy
        run: node ./scripts/pnpm-release-age-policy.mjs

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Dry-run every publishable tarball
        run: |
          set -euo pipefail
          VERSION="$(node -e "process.stdout.write(require('./packages/agent-app/package.json').version)")"
          TAG="v${VERSION}"
          PACKAGE_COUNT="$(node --input-type=module -e "import { packageCatalog } from './scripts/package-catalog.mjs'; process.stdout.write(String(packageCatalog.filter((entry) => entry.publishable).length))")"
          pnpm run release:publish -- --dry-run --tag "$TAG"
          {
            echo "## Release dry run"
            echo
            echo "- Tag: \`$TAG\`"
            echo "- Publishable tarballs: $PACKAGE_COUNT"
            echo "- Result: green"
          } >> "$GITHUB_STEP_SUMMARY"

  verdict:
    name: Required verdict
    if: always()
    needs:
      - verify
      - website
      - release-dry-run
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Publish one required verdict
        env:
          EVENT_NAME: ${{ github.event_name }}
          VERIFY_RESULT: ${{ needs.verify.result }}
          WEBSITE_RESULT: ${{ needs.website.result }}
          RELEASE_DRY_RUN_RESULT: ${{ needs.release-dry-run.result }}
        run: |
          set -euo pipefail
          {
            echo "## Required CI verdict"
            echo
            echo "- Package matrix: $VERIFY_RESULT"
            echo "- Website: $WEBSITE_RESULT"
            echo "- Release dry run: $RELEASE_DRY_RUN_RESULT"
          } >> "$GITHUB_STEP_SUMMARY"

          if [[ "$VERIFY_RESULT" != "success" || "$WEBSITE_RESULT" != "success" ]]; then
            echo "CI VERDICT: FAILED"
            exit 1
          fi
          if [[ "$EVENT_NAME" == "pull_request" && "$RELEASE_DRY_RUN_RESULT" != "success" ]]; then
            echo "CI VERDICT: FAILED"
            exit 1
          fi
          echo "CI VERDICT: GREEN"
