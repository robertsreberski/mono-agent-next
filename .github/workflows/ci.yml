name: ci

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Verify runnable architecture (Node ${{ matrix.node-version }})
    runs-on: ubuntu-latest
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        node-version: ["22.19.0", "24"]

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup pnpm
        uses: pnpm/action-setup@v6
        with:
          version: "10.28.2"

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "${{ matrix.node-version }}"
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Check runtime floors
        run: |
          node scripts/check/pnpm-release-age-policy.mjs
          pnpm run check:node

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Check dependency vulnerabilities
        if: ${{ matrix.node-version == '22.19.0' }}
        run: pnpm run check:dependency-vulnerabilities

      - name: Scan secrets
        if: ${{ matrix.node-version == '22.19.0' }}
        run: |
          docker run --rm \
            -v "$PWD:/repo" \
            ghcr.io/gitleaks/gitleaks:v8.30.1 \
            dir --redact --no-banner --config /repo/.gitleaks.toml /repo

      - name: Check OSS and package boundaries
        run: |
          pnpm run check:oss-hygiene
          pnpm run check:licenses
          pnpm run check:source-line-length
          pnpm run check:architecture
          pnpm run check:codex-discoverability
          pnpm run check:consumer-docs-consistency
          pnpm run check:getting-started-version-pins

      - name: Check generated documentation contracts
        run: |
          pnpm run generate:package-docs
          pnpm run generate:public-api-docs
          pnpm run check:source-beta-budgets
          pnpm run check:source-beta-docs
          pnpm run check:docs

      - name: Build and typecheck the complete workspace
        run: |
          pnpm run build
          pnpm run check:doc-snippets
          pnpm run typecheck

      - name: Lint typed promise handling
        run: pnpm run check:lint

      - name: Check built package exports and import safety
        run: pnpm run check:deep-imports

      - name: Prove scaffolded consumer contracts
        if: ${{ matrix.node-version == '22.19.0' }}
        run: pnpm run verify:consumers

      - name: Test the complete workspace
        run: |
          pnpm run scripts:test
          pnpm run test

      - name: Test release contracts
        if: ${{ matrix.node-version == '22.19.0' }}
        run: pnpm run release:test:unit

      - name: Prove standalone operator products
        run: pnpm run verify:operator-products

      - name: Install the browser lane's browser
        if: ${{ matrix.node-version == '22.19.0' }}
        run: pnpm exec playwright install --with-deps chromium

      - name: Prove the console renders in a real browser
        if: ${{ matrix.node-version == '22.19.0' }}
        run: pnpm run test:browser

      - name: Prove packed minimal consumer
        if: ${{ matrix.node-version == '22.19.0' }}
        run: pnpm run verify:minimal

      - name: Prove packed complete system
        if: ${{ matrix.node-version == '22.19.0' }}
        run: pnpm run verify:system

      - name: Check generated contracts and whitespace
        run: git diff --exit-code && git diff --check

  website:
    name: Website (Node 22)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: website

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v6
        with:
          version: "10.28.2"

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22.19.0"
          cache: pnpm
          cache-dependency-path: website/pnpm-lock.yaml

      - name: Install website dependencies
        run: pnpm install --frozen-lockfile

      - name: Test website transforms
        run: pnpm run test:unit

      - name: Install Chromium
        run: pnpm exec playwright install --with-deps chromium

      - name: Build docs site (check-asides -> sync-content -> astro build -> check-links)
        run: pnpm run build

      - name: Audit every built page for accessibility
        run: pnpm run test:a11y

  verdict:
    name: Required verdict
    if: always()
    needs:
      - verify
      - website
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Publish required verdict
        env:
          VERIFY_RESULT: ${{ needs.verify.result }}
          WEBSITE_RESULT: ${{ needs.website.result }}
        run: |
          if [[ "$VERIFY_RESULT" != "success" || "$WEBSITE_RESULT" != "success" ]]; then
            echo "CI VERDICT: FAILED"
            exit 1
          fi
          echo "CI VERDICT: GREEN"
